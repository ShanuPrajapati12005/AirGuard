<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 810" width="1400" height="810" role="img" aria-labelledby="t d"><title id="t">AirGuard system architecture</title><desc id="d">Four-stage pipeline: ingest from Open-Meteo and an ESP32 sensor, normalize in weatherApi.ts, compute personal exposure in aqiCalculator.ts, hold state in AirGuardContext, then feed five feature modules.</desc><defs>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity=".05"/><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#141414" flood-opacity=".08"/></filter>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#54524c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs><rect width="1400" height="810" fill="#f6f5f3"/><text x="40" y="62" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#111110" text-anchor="start" letter-spacing="-0.6" opacity="1">AirGuard system architecture</text><text x="40" y="90" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#54524c" text-anchor="start" letter-spacing="0" opacity="1">From raw telemetry to a personal decision, entirely in the browser. Cloud services plug in behind the same services layer.</text><text x="40" y="142" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#1e3f32" text-anchor="start" letter-spacing="0" opacity="1">1  Ingest</text><line x1="40" y1="152" x2="330" y2="152" stroke="#1e3f32" stroke-width="2"/><text x="390" y="142" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#1e3f32" text-anchor="start" letter-spacing="0" opacity="1">2  Normalize</text><line x1="390" y1="152" x2="680" y2="152" stroke="#1e3f32" stroke-width="2"/><text x="740" y="142" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#1e3f32" text-anchor="start" letter-spacing="0" opacity="1">3  Personal exposure</text><line x1="740" y1="152" x2="1030" y2="152" stroke="#1e3f32" stroke-width="2"/><text x="1090" y="142" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#1e3f32" text-anchor="start" letter-spacing="0" opacity="1">4  Client state</text><line x1="1090" y1="152" x2="1360" y2="152" stroke="#1e3f32" stroke-width="2"/><rect x="40" y="168" width="290" height="100" rx="16" fill="#ffffff" stroke="#e2dfd7" stroke-width="1" filter="url(#sh)" /><rect x="40" y="168" width="6" height="100" rx="3" fill="#2563eb"/><text x="62" y="200" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#111110" text-anchor="start" letter-spacing="0" opacity="1">Open-Meteo Air Quality</text><text x="62" y="226" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#54524c" text-anchor="start" letter-spacing="0" opacity="1">PM2.5, PM10, NO₂, O₃, SO₂, CO</text><text x="62" y="248" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#54524c" text-anchor="start" letter-spacing="0" opacity="1">US AQI, hourly forecast</text><rect x="40" y="282" width="290" height="100" rx="16" fill="#ffffff" stroke="#e2dfd7" stroke-width="1" filter="url(#sh)" /><rect x="40" y="282" width="6" height="100" rx="3" fill="#0891b2"/><text x="62" y="314" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#111110" text-anchor="start" letter-spacing="0" opacity="1">Open-Meteo Weather</text><text x="62" y="340" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#54524c" text-anchor="start" letter-spacing="0" opacity="1">Temperature, humidity</text><text x="62" y="362" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#54524c" text-anchor="start" letter-spacing="0" opacity="1">Wind vector</text><rect x="40" y="396" width="290" height="100" rx="16" fill="#ffffff" stroke="#e2dfd7" stroke-width="1" filter="url(#sh)" /><rect x="40" y="396" width="6" height="100" rx="3" fill="#f59e0b"/><text x="62" y="428" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#111110" text-anchor="start" letter-spacing="0" opacity="1">ESP32 + PMS5003 laser sensor</text><text x="62" y="454" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#54524c" text-anchor="start" letter-spacing="0" opacity="1">Live microclimate stream</text><text x="62" y="476" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#54524c" text-anchor="start" letter-spacing="0" opacity="1">±3 µg/m³ jitter, simulated in demo</text><rect x="390" y="168" width="290" height="328" rx="16" fill="#ffffff" stroke="#e2dfd7" stroke-width="1" filter="url(#sh)" /><rect x="390" y="168" width="290" height="64" rx="16" fill="#1e3f32" stroke="none" stroke-width="1" /><rect x="390" y="206" width="290" height="26" fill="#1e3f32"/><text x="412" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#fff" text-anchor="start" letter-spacing="0" opacity="1">weatherApi.ts</text><text x="412" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#bfe3cf" text-anchor="start" letter-spacing="0" opacity="1">fetchLiveAirQuality()</text><circle cx="416" cy="265" r="3.5" fill="#1e3f32"/><text x="430" y="270" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#111110" text-anchor="start" letter-spacing="0" opacity="1">Parallel air + weather fetch</text><circle cx="416" cy="309" r="3.5" fill="#1e3f32"/><text x="430" y="314" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#111110" text-anchor="start" letter-spacing="0" opacity="1">NAQI mapper: Good to Severe</text><circle cx="416" cy="353" r="3.5" fill="#1e3f32"/><text x="430" y="358" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#111110" text-anchor="start" letter-spacing="0" opacity="1">Indoor model: PM2.5 × 0.38</text><circle cx="416" cy="397" r="3.5" fill="#1e3f32"/><text x="430" y="402" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#111110" text-anchor="start" letter-spacing="0" opacity="1">Hotspot plumes around the user</text><circle cx="416" cy="441" r="3.5" fill="#1e3f32"/><text x="430" y="446" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#111110" text-anchor="start" letter-spacing="0" opacity="1">Location search + reverse geocode</text><rect x="740" y="168" width="290" height="328" rx="16" fill="#ffffff" stroke="#e2dfd7" stroke-width="1" filter="url(#sh)" /><rect x="740" y="168" width="290" height="64" rx="16" fill="#1e3f32" stroke="none" stroke-width="1" /><rect x="740" y="206" width="290" height="26" fill="#1e3f32"/><text x="762" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#fff" text-anchor="start" letter-spacing="0" opacity="1">aqiCalculator.ts</text><text x="762" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#bfe3cf" text-anchor="start" letter-spacing="0" opacity="1">calculateExposureScore()</text><circle cx="766" cy="265" r="3.5" fill="#1e3f32"/><text x="780" y="270" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#111110" text-anchor="start" letter-spacing="0" opacity="1">Pollution × duration factor</text><circle cx="766" cy="309" r="3.5" fill="#1e3f32"/><text x="780" y="314" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#111110" text-anchor="start" letter-spacing="0" opacity="1">Activity multiplier 0.5× to 2.2×</text><circle cx="766" cy="353" r="3.5" fill="#1e3f32"/><text x="780" y="358" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#111110" text-anchor="start" letter-spacing="0" opacity="1">Vulnerability from health profile</text><circle cx="766" cy="397" r="3.5" fill="#1e3f32"/><text x="780" y="402" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#111110" text-anchor="start" letter-spacing="0" opacity="1">Score 0–100 into 4 risk tiers</text><rect x="766.0" y="450" width="71.4" height="10" fill="#10b981" rx="2"/><rect x="837.4" y="450" width="59.5" height="10" fill="#f59e0b" rx="2"/><rect x="896.9" y="450" width="47.6" height="10" fill="#f97316" rx="2"/><rect x="944.5" y="450" width="59.5" height="10" fill="#ef4444" rx="2"/><text x="766" y="482" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#54524c" text-anchor="start" letter-spacing="0" opacity="1">Low</text><text x="1004" y="482" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#54524c" text-anchor="end" letter-spacing="0" opacity="1">Critical</text><rect x="1090" y="168" width="270" height="328" rx="16" fill="#ffffff" stroke="#e2dfd7" stroke-width="1" filter="url(#sh)" /><rect x="1090" y="168" width="270" height="64" rx="16" fill="#1e3f32" stroke="none" stroke-width="1" /><rect x="1090" y="206" width="270" height="26" fill="#1e3f32"/><text x="1112" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#fff" text-anchor="start" letter-spacing="0" opacity="1">AirGuardContext.tsx</text><text x="1112" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#bfe3cf" text-anchor="start" letter-spacing="0" opacity="1">useAirGuard()</text><circle cx="1116" cy="265" r="3.5" fill="#1e3f32"/><text x="1130" y="270" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#111110" text-anchor="start" letter-spacing="0" opacity="1">Live telemetry + sensor noise</text><circle cx="1116" cy="309" r="3.5" fill="#1e3f32"/><text x="1130" y="314" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#111110" text-anchor="start" letter-spacing="0" opacity="1">Active location + scenario</text><circle cx="1116" cy="353" r="3.5" fill="#1e3f32"/><text x="1130" y="358" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#111110" text-anchor="start" letter-spacing="0" opacity="1">Health profile in localStorage</text><circle cx="1116" cy="397" r="3.5" fill="#1e3f32"/><text x="1130" y="402" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#111110" text-anchor="start" letter-spacing="0" opacity="1">Light and dark theme</text><line x1="334" y1="332" x2="384" y2="332" stroke="#1e3f32" stroke-width="2.4" marker-end="url(#ar)"/><line x1="684" y1="332" x2="734" y2="332" stroke="#1e3f32" stroke-width="2.4" marker-end="url(#ar)"/><line x1="1034" y1="332" x2="1084" y2="332" stroke="#1e3f32" stroke-width="2.4" marker-end="url(#ar)"/><path d="M330 218 C 360 218, 362 332, 384 332" fill="none" stroke="#54524c" stroke-width="1.6" opacity=".55"/><path d="M330 332 C 360 332, 362 332, 384 332" fill="none" stroke="#54524c" stroke-width="1.6" opacity=".55"/><path d="M330 446 C 360 446, 362 332, 384 332" fill="none" stroke="#54524c" stroke-width="1.6" opacity=".55"/><path d="M1225 496 V 530 H 150 V 566" fill="none" stroke="#1e3f32" stroke-width="2" stroke-linejoin="round"/><line x1="150" y1="530" x2="150" y2="566" stroke="#1e3f32" stroke-width="2" marker-end="url(#ar)"/><line x1="425" y1="530" x2="425" y2="566" stroke="#1e3f32" stroke-width="2" marker-end="url(#ar)"/><line x1="700" y1="530" x2="700" y2="566" stroke="#1e3f32" stroke-width="2" marker-end="url(#ar)"/><line x1="975" y1="530" x2="975" y2="566" stroke="#1e3f32" stroke-width="2" marker-end="url(#ar)"/><line x1="1250" y1="530" x2="1250" y2="566" stroke="#1e3f32" stroke-width="2" marker-end="url(#ar)"/><circle cx="1225" cy="496" r="4.5" fill="#1e3f32"/><text x="40" y="518" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#1e3f32" text-anchor="start" letter-spacing="0" opacity="1">Every screen reads the same context</text><rect x="30" y="570" width="240" height="130" rx="16" fill="#ffffff" stroke="#e2dfd7" stroke-width="1" filter="url(#sh)" /><circle cx="56" cy="598" r="7" fill="#ef4444"/><text x="72" y="604" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#111110" text-anchor="start" letter-spacing="0" opacity="1">Smart routes</text><text x="52" y="634" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#54524c" text-anchor="start" letter-spacing="0" opacity="1">SmartRouteComparison.tsx</text><text x="52" y="668" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#111110" text-anchor="start" letter-spacing="0" opacity="1">Expressway vs green canopy</text><rect x="305" y="570" width="240" height="130" rx="16" fill="#ffffff" stroke="#e2dfd7" stroke-width="1" filter="url(#sh)" /><circle cx="331" cy="598" r="7" fill="#7c3aed"/><text x="347" y="604" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#111110" text-anchor="start" letter-spacing="0" opacity="1">AI Guardian</text><text x="327" y="634" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#54524c" text-anchor="start" letter-spacing="0" opacity="1">AIGuardianChat.tsx</text><text x="327" y="668" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#111110" text-anchor="start" letter-spacing="0" opacity="1">Gemini, with rule-based fallback</text><rect x="580" y="570" width="240" height="130" rx="16" fill="#ffffff" stroke="#e2dfd7" stroke-width="1" filter="url(#sh)" /><circle cx="606" cy="598" r="7" fill="#2563eb"/><text x="622" y="604" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#111110" text-anchor="start" letter-spacing="0" opacity="1">Pollution map</text><text x="602" y="634" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#54524c" text-anchor="start" letter-spacing="0" opacity="1">InteractivePollutionMap.tsx</text><text x="602" y="668" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#111110" text-anchor="start" letter-spacing="0" opacity="1">Leaflet hotspots + route overlay</text><rect x="855" y="570" width="240" height="130" rx="16" fill="#ffffff" stroke="#e2dfd7" stroke-width="1" filter="url(#sh)" /><circle cx="881" cy="598" r="7" fill="#f59e0b"/><text x="897" y="604" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#111110" text-anchor="start" letter-spacing="0" opacity="1">Best time</text><text x="877" y="634" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#54524c" text-anchor="start" letter-spacing="0" opacity="1">BestTimePlanner.tsx</text><text x="877" y="668" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#111110" text-anchor="start" letter-spacing="0" opacity="1">Hourly forecast, 6 AM window</text><rect x="1130" y="570" width="240" height="130" rx="16" fill="#ffffff" stroke="#e2dfd7" stroke-width="1" filter="url(#sh)" /><circle cx="1156" cy="598" r="7" fill="#10b981"/><text x="1172" y="604" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#111110" text-anchor="start" letter-spacing="0" opacity="1">Activity risk</text><text x="1152" y="634" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#54524c" text-anchor="start" letter-spacing="0" opacity="1">ActivityRiskCalculator.tsx</text><text x="1152" y="668" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#111110" text-anchor="start" letter-spacing="0" opacity="1">Walk, cycle, run: what if?</text><rect x="40" y="726" width="1320" height="56" rx="14" fill="#e9f1ec" stroke="#c5dccf" stroke-width="1" /><path d="M72 742 l9 -4 l9 4 v8 c0 7 -5 11 -9 13 c-4 -2 -9 -6 -9 -13 z" fill="none" stroke="#1e3f32" stroke-width="2" stroke-linejoin="round"/><text x="104" y="760" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1e3f32" text-anchor="start" letter-spacing="0" opacity="1">Local-first by design: the health profile never leaves the browser. Only a location is sent to Open-Meteo.</text></svg>