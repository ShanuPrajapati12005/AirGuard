<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 670" width="1400" height="670" role="img" aria-labelledby="t d"><title id="t">Diurnal AQI pattern and best outdoor window</title><desc id="d">AQI stays high overnight, drops below 100 between 5:30 and 7:30 AM, spikes during morning rush, eases in the afternoon, and peaks again in the evening.</desc><defs>
