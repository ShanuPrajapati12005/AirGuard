</defs><defs><linearGradient id="ar2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e3f32" stop-opacity=".30"/><stop offset="1" stop-color="#1e3f32" stop-opacity="0"/></linearGradient><clipPath id="cp"><rect x="96" y="150" width="1244" height="390"/></clipPath></defs><rect width="1400" height="670" fill="#f6f5f3"/><text x="40" y="62" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#111110" text-anchor="start" letter-spacing="-0.6" opacity="1">Best outdoor window: why 6 AM wins</text><text x="40" y="90" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#54524c" text-anchor="start" letter-spacing="0" opacity="1">Illustrative diurnal pattern for a Delhi-like city (demo data). Thermal inversion traps pollutants overnight; morning sun lifts them before rush hour.</text><rect x="96" y="484.3" width="1244" height="55.7" fill="#10b981" opacity=".10"/><text x="84" y="516.1428571428571" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#54524c" text-anchor="end" letter-spacing="0" opacity="1">Good</text><rect x="96" y="428.6" width="1244" height="55.7" fill="#84cc16" opacity=".10"/><text x="84" y="460.42857142857144" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#54524c" text-anchor="end" letter-spacing="0" opacity="1">Satisfactory</text><rect x="96" y="317.1" width="1244" height="111.4" fill="#f59e0b" opacity=".10"/><text x="84" y="376.8571428571429" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#54524c" text-anchor="end" letter-spacing="0" opacity="1">Moderate</text><rect x="96" y="205.7" width="1244" height="111.4" fill="#f97316" opacity=".10"/><text x="84" y="265.42857142857144" font-family="Inter, 'Segoe UI', Roboto, '