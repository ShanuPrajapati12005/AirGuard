 opacity="1">Afternoon</text><text x="910" y="616" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#54524c" text-anchor="middle" letter-spacing="0" opacity="1">Moderate dispersion</text><text x="96" y="138" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#54524c" text-anchor="start" letter-spacing="0" opacity="1">AQI</text><text x="225.8086956521739" y="196" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#1e3f32" text-anchor="middle" letter-spacing="0" opacity="1">Thermal inversion</text><text x="225.8086956521739" y="214" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#54524c" text-anchor="middle" letter-spacing="0" opacity="1">traps particulates</text></svg>