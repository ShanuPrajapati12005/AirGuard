<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 770" width="1400" height="770" role="img" aria-labelledby="t d"><title id="t">AirGuard exposure model</title><desc id="d">Pollution, duration, activity and vulnerability factors are multiplied by 25 and clamped to 0 to 100. Running for 60 minutes at AQI 276 scores 69, which is High risk.</desc><defs>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity=".05"/><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#141414" flood-opacity=".08"/></filter>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#54524c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs><rect width="1400" height="770" fill="#f6f5f3"/><text x="40" y="62" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#111110" text-anchor="start" letter-spacing="-0.6" opacity="1">How the personal exposure score is built</text><text x="40" y="90" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#54524c" text-anchor="start" letter-spacing="0" opacity="1">Four factors multiply, scale by 25, and clamp to 0–100. Transparent on purpose: you can verify every number by hand.</text><rect x="40" y="128" width="470" height="102" rx="16" fill="#ffffff" stroke="#e2dfd7" stroke-width="1" filter="url(#sh)" /><rect x="40" y="128" width="6" height="102" rx="3" fill="#2563eb"/><text x="64" y="160" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#111110" text-anchor="start" letter-spacing="0" opacity="1">Pollution factor</text><text x="64" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#54524c" text-anchor="start" letter-spacing="0" opacity="1">min(AQI ÷ 200, 2.5)</text><text x="64" y="212" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#54524c" text-anchor="start" letter-spacing="0" opacity="1">AQI 276</text><text x="488" y="194" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" fill="#2563eb" text-anchor="end" letter-spacing="-1" opacity="1">1.38</text><rect x="40" y="246" width="470" height="102" rx="16" fill="#ffffff" stroke="#e2dfd7" stroke-width="1" filter="url(#sh)" /><rect x="40" y="246" width="6" height="102" rx="3" fill="#0891b2"/><text x="64" y="278" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#111110" text-anchor="start" letter-spacing="0" opacity="1">Duration factor</text><text x="64" y="304" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#54524c" text-anchor="start" letter-spacing="0" opacity="1">min(minutes ÷ 60, 2.0)</text><text x="64" y="330" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#54524c" text-anchor="start" letter-spacing="0" opacity="1">60 min</text><text x="488" y="312" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" fill="#0891b2" text-anchor="end" letter-spacing="-1" opacity="1">1.00</text><rect x="40" y="364" width="470" height="102" rx="16" fill="#ffffff" stroke="#e2dfd7" stroke-width="1" filter="url(#sh)" /><rect x="40" y="364" width="6" height="102" rx="3" fill="#f59e0b"/><text x="64" y="396" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#111110" text-anchor="start" letter-spacing="0" opacity="1">Activity multiplier</text><text x="64" y="422" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#54524c" text-anchor="start" letter-spacing="0" opacity="1">ventilation-based table</text><text x="64" y="448" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#54524c" text-anchor="start" letter-spacing="0" opacity="1">Running</text><text x="488" y="430" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" fill="#f59e0b" text-anchor="end" letter-spacing="-1" opacity="1">2.0×</text><rect x="40" y="482" width="470" height="102" rx="16" fill="#ffffff" stroke="#e2dfd7" stroke-width="1" filter="url(#sh)" /><rect x="40" y="482" width="6" height="102" rx="3" fill="#7c3aed"/><text x="64" y="514" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#111110" text-anchor="start" letter-spacing="0" opacity="1">Vulnerability multiplier</text><text x="64" y="540" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#54524c" text-anchor="start" letter-spacing="0" opacity="1">1 + age + condition + sensitivity</text><text x="64" y="566" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#54524c" text-anchor="start" letter-spacing="0" opacity="1">Healthy adult</text><text x="488" y="548" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" fill="#7c3aed" text-anchor="end" letter-spacing="-1" opacity="1">1.00</text><path d="M510 179 C 550 179, 548 330, 590 330" fill="none" stroke="#54524c" stroke-width="1.8" opacity=".6"/><path d="M510 297 C 550 297, 548 330, 590 330" fill="none" stroke="#54524c" stroke-width="1.8" opacity=".6"/><path d="M510 415 C 550 415, 548 330, 590 330" fill="none" stroke="#54524c" stroke-width="1.8" opacity=".6"/><path d="M510 533 C 550 533, 548 330, 590 330" fill="none" stroke="#54524c" stroke-width="1.8" opacity=".6"/><rect x="590" y="262" width="210" height="136" rx="18" fill="#1e3f32" stroke="none" stroke-width="1" filter="url(#sh)" /><text x="695" y="300" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#bfe3cf" text-anchor="middle" letter-spacing="0" opacity="1">Multiply</text><text x="695" y="338" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="-1" opacity="1">× 25</text><text x="695" y="372" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#bfe3cf" text-anchor="middle" letter-spacing="0" opacity="1">then round, clamp to 100</text><line x1="804" y1="330" x2="872" y2="330" stroke="#1e3f32" stroke-width="2.6" marker-end="url(#ar)"/><rect x="880" y="128" width="480" height="440" rx="22" fill="#ffffff" stroke="#e2dfd7" stroke-width="1" filter="url(#sh)" /><text x="1120" y="168" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#111110" text-anchor="middle" letter-spacing="0" opacity="1">Personal exposure index</text><path d="M970.0 342.1 A150 150 0 0 1 1033.5 217.4" fill="none" stroke="#10b981" stroke-width="28"/><path d="M1030.1 219.9 A150 150 0 0 1 1145.5 192.2" fill="none" stroke="#f59e0b" stroke-width="28"/><path d="M1141.4 191.5 A150 150 0 0 1 1227.5 235.4" fill="none" stroke="#f97316" stroke-width="28"/><path d="M1224.6 232.5 A150 150 0 0 1 1270.0 342.1" fill="none" stroke="#ef4444" stroke-width="28"/><line x1="1120" y1="340" x2="1200.9" y2="220.9" stroke="#111110" stroke-width="4" stroke-linecap="round"/><circle cx="1120" cy="340" r="9" fill="#111110"/><circle cx="1120" cy="340" r="3.5" fill="#fff"/><text x="1120" y="412" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" fill="#111110" text-anchor="middle" letter-spacing="-2" opacity="1">69</text><rect x="1068" y="428" width="104" height="28" rx="14.0" fill="#f97316" stroke="none" stroke-width="1" /><text x="1120.0" y="446.55" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0" opacity="1">HIGH RISK</text><text x="970" y="366" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#54524c" text-anchor="middle" letter-spacing="0" opacity="1">0</text><text x="1270" y="366" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#54524c" text-anchor="middle" letter-spacing="0" opacity="1">100</text><text x="1120" y="486" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="500" fill="#54524c" text-anchor="middle" letter-spacing="0" opacity="1">AQI 276 · 1.38 × 1.00 × 2.0 × 1.00 × 25 = 69</text><rect x="910" y="512" width="12" height="12" rx="3" fill="#10b981"/><text x="928" y="523" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110" text-anchor="start" letter-spacing="0" opacity="1">Low</text><text x="928" y="540" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#54524c" text-anchor="start" letter-spacing="0" opacity="1">0–30</text><rect x="1020" y="512" width="12" height="12" rx="3" fill="#f59e0b"/><text x="1038" y="523" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110" text-anchor="start" letter-spacing="0" opacity="1">Moderate</text><text x="1038" y="540" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#54524c" text-anchor="start" letter-spacing="0" opacity="1">31–55</text><rect x="1130" y="512" width="12" height="12" rx="3" fill="#f97316"/><text x="1148" y="523" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110" text-anchor="start" letter-spacing="0" opacity="1">High</text><text x="1148" y="540" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#54524c" text-anchor="start" letter-spacing="0" opacity="1">56–75</text><rect x="1240" y="512" width="12" height="12" rx="3" fill="#ef4444"/><text x="1258" y="523" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110" text-anchor="start" letter-spacing="0" opacity="1">Critical</text><text x="1258" y="540" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#54524c" text-anchor="start" letter-spacing="0" opacity="1">76–100</text><rect x="40" y="612" width="770" height="120" rx="16" fill="#ffffff" stroke="#e2dfd7" stroke-width="1" filter="url(#sh)" /><text x="64" y="644" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#111110" text-anchor="start" letter-spacing="0" opacity="1">Activity multipliers (minute-ventilation based)</text><rect x="64" y="662" width="110" height="54" rx="12" fill="#f6f5f3" stroke="#e2dfd7" stroke-width="1" /><text x="119" y="684" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#54524c" text-anchor="middle" letter-spacing="0" opacity="1">Sit</text><text x="119" y="706" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#111110" text-anchor="middle" letter-spacing="0" opacity="1">0.5×</text><rect x="186" y="662" width="110" height="54" rx="12" fill="#f6f5f3" stroke="#e2dfd7" stroke-width="1" /><text x="241" y="684" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#54524c" text-anchor="middle" letter-spacing="0" opacity="1">Walk</text><text x="241" y="706" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#111110" text-anchor="middle" letter-spacing="0" opacity="1">1.0×</text><rect x="308" y="662" width="110" height="54" rx="12" fill="#f6f5f3" stroke="#e2dfd7" stroke-width="1" /><text x="363" y="684" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#54524c" text-anchor="middle" letter-spacing="0" opacity="1">Commute</text><text x="363" y="706" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#111110" text-anchor="middle" letter-spacing="0" opacity="1">1.2×</text><rect x="430" y="662" width="110" height="54" rx="12" fill="#f6f5f3" stroke="#e2dfd7" stroke-width="1" /><text x="485" y="684" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#54524c" text-anchor="middle" letter-spacing="0" opacity="1">Cycle</text><text x="485" y="706" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#111110" text-anchor="middle" letter-spacing="0" opacity="1">1.5×</text><rect x="552" y="662" width="110" height="54" rx="12" fill="#f6f5f3" stroke="#e2dfd7" stroke-width="1" /><text x="607" y="684" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#54524c" text-anchor="middle" letter-spacing="0" opacity="1">Run</text><text x="607" y="706" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#111110" text-anchor="middle" letter-spacing="0" opacity="1">2.0×</text><rect x="674" y="662" width="110" height="54" rx="12" fill="#f6f5f3" stroke="#e2dfd7" stroke-width="1" /><text x="729" y="684" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#54524c" text-anchor="middle" letter-spacing="0" opacity="1">Sports</text><text x="729" y="706" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#111110" text-anchor="middle" letter-spacing="0" opacity="1">2.2×</text><rect x="880" y="612" width="480" height="120" rx="18" fill="#1e3f32" stroke="none" stroke-width="1" filter="url(#sh)" /><text x="906" y="646" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="start" letter-spacing="0" opacity="1">Same air, different choice</text><text x="906" y="676" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#bfe3cf" text-anchor="start" letter-spacing="0" opacity="1">Walking 20 min</text><text x="1334" y="676" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#6ee7b7" text-anchor="end" letter-spacing="0" opacity="1">12  Low</text><text x="906" y="708" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#bfe3cf" text-anchor="start" letter-spacing="0" opacity="1">Running 60 min</text><text x="1334" y="708" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#fdba74" text-anchor="end" letter-spacing="0" opacity="1">69  High</text></svg>